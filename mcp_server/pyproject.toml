[project]
name = "mwt-mcp"
version = "1.0.0"
description = "Servidor MCP para la Consola MWT.ONE — expone la operación completa (clientes, productos, expedientes, SAP, inventario, transferencias, pagos) como herramientas MCP."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0,<2.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
mwt-mcp = "mwt_mcp.__main__:main"
# Ola 2 · 2.14 — servidores por dominio (cada uno monta solo su subset de tools).
mwt-mcp-comercial = "mwt_mcp.domains_cli:main_comercial"
mwt-mcp-logistica = "mwt_mcp.domains_cli:main_logistica"
mwt-mcp-finanzas = "mwt_mcp.domains_cli:main_finanzas"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mwt_mcp"]

