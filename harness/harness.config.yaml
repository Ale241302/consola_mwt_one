# =============================================================================
# harness.config.yaml — Configuración raíz del harness de agentes MWT.ONE
# -----------------------------------------------------------------------------
# Fuente de verdad de los TARGETS activos (CLIs), el mapeo de modelos, las rutas
# canónicas (entrada) y las rutas de salida por CLI (artefactos derivados), más
# la referencia al servidor MCP compartido (mcp_server/).
#
# Reglas:
#   - Editable a mano (esto NO es un artefacto derivado).
#   - Las rutas son RELATIVAS a la raíz del repo (consola_mwt_one/).
#   - "canonical/" es la única fuente editable de agents/skills/tools.
#   - Lo que vive bajo "out_dir" de cada target es DERIVADO: lo regenera `sync`
#     y se pisa sin piedad (igual que dist/ o el esquema SQL-first).
#
# Ver: harness/ARCHITECTURE.md §3 (matriz de portabilidad) y §4 (estructura).
# =============================================================================

version: 1

# --- Idioma operativo (CLAUDE.md §11) ---------------------------------------
# Conversación y docs en español; código e identificadores en inglés.
language:
  conversation: es
  code: en

# --- Rutas canónicas (FUENTE DE VERDAD, neutra de proveedor) -----------------
# Relativas a harness/. El adapter resuelve canonical_dir contra estas entradas.
canonical:
  root: canonical/            # carpeta canónica raíz
  agents_md: canonical/AGENTS.md   # instrucciones base portables (deriva de CLAUDE.md)
  agents: canonical/agents/   # subagentes canónicos (.md frontmatter neutro)
  skills: canonical/skills/   # skills canónicas (<name>/SKILL.md)
  tools: canonical/tools/     # manifiesto de tools MCP que el harness expone

# --- Servidor MCP compartido (una implementación, N consumidores) ------------
# El mcp_server/ ya existe (FastMCP, ~88 tools sobre la API REST). Los adapters
# NO transpilan tools: solo escriben la entrada de config MCP de cada CLI
# apuntando a este mismo servidor (stdio por defecto).
mcp:
  name: mwt                   # id lógico del servidor en cada config MCP
  # Lanzamiento por stdio: `python -m mwt_mcp` desde mcp_server/ (ver __main__.py)
  command: python
  args: ["-m", "mwt_mcp"]
  cwd: mcp_server/            # relativo a la raíz del repo
  transport: stdio            # stdio | http (FastMCP streamable-http)
  # Variables de entorno que el servidor MCP espera (ver mcp_server/mwt_mcp/config.py).
  # NO se hardcodean secretos aquí: se inyectan desde el entorno del operador.
  env:
    MWT_API_BASE: "${MWT_API_BASE:-https://consola.mwt.one/api}"
    MWT_MCP_TOKEN: "${MWT_MCP_TOKEN}"     # token de servicio (manage.py mint_mcp_token)
    MWT_MCP_TRANSPORT: "stdio"

# --- Targets (CLIs) ----------------------------------------------------------
# Cada target declara: si está activo, el mapeo de modelos por rol, y el out_dir
# donde el adapter escribe los artefactos nativos (DERIVADOS).
#
# El mapeo de modelos usa roles neutros:
#   - architect: razonamiento pesado (planes, arquitectura, diseño DB/UI)
#   - engineer:  ejecución de ingeniería estándar (backend, MCP, edits)
#   - reviewer:  auditoría crítica (gates, R1/R3/R4) — razonamiento alto
#   - worker:    ejecución estándar (genera_ui, edits genéricos)
#   - fast:      tareas baratas/rápidas (lint, clasificación)
# El adapter resuelve cada rol al nombre real de modelo del CLI. Los roles deben
# existir aquí para CADA target; si falta, el agente hereda el default del CLI.
targets:

  # ----- Claude Code (target primario; el que usa el CEO hoy) ----------------
  claude:
    enabled: true
    adapter: harness.adapters.claude:ClaudeAdapter
    out_dir: .claude/         # .claude/agents/, .claude/skills/, .mcp.json
    # Bloque gestionado dentro de CLAUDE.md (merge no destructivo con marcadores).
    project_instructions: CLAUDE.md
    models:
      architect: opus
      engineer: sonnet
      reviewer: opus
      worker: sonnet
      fast: haiku

  # ----- Gemini CLI (extensión; lo implementa la Fase 3) --------------------
  gemini:
    enabled: false
    adapter: harness.adapters.gemini:GeminiAdapter
    out_dir: .gemini/extensions/mwt/   # GEMINI.md, agents/, commands/*.toml, settings
    project_instructions: GEMINI.md
    models:
      architect: gemini-2.5-pro
      engineer: gemini-2.5-flash
      reviewer: gemini-2.5-pro
      worker: gemini-2.5-flash
      fast: gemini-2.5-flash-lite

  # ----- Kimi CLI (agent specs YAML; lo implementa la Fase 3) ---------------
  kimi:
    enabled: false
    adapter: harness.adapters.kimi:KimiAdapter
    out_dir: .kimi/agents/     # specs YAML + referencia a --mcp-config-file
    project_instructions: AGENTS.md
    models:
      architect: k2.5
      engineer: k2.5
      reviewer: k2.5
      worker: k2.5
      fast: k2-turbo
