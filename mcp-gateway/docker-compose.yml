# =====================================================================
# MWT.ONE · MCP Gateway Stack
# Expone el mcp_server de MWT como Remote MCP para Claude.ai/Cowork/Desktop.
#
# Stack de identidad REAL: Authentik (goauthentik). El gateway contextforge
# usa Authentik como OIDC/OAuth resource server de producción en mcp.mwt.one.
# La migración planeada a Pocket-ID queda documentada e INACTIVA en
# docker-compose.pocketid.yml (no activarla sin su propia ventana OAuth).
#
# Componentes (alineado al runtime de producción):
#   authentik-postgresql · authentik-redis · authentik-server · authentik-worker
#   contextforge (MCP gateway / OAuth resource server)
# =====================================================================

name: mcp-gateway

services:
  # -----------------------------------------------------------------
  # Authentik — PostgreSQL 16 (datos OAuth: usuarios, flows, outposts)
  # -----------------------------------------------------------------
  authentik-postgresql:
    image: postgres:16-alpine
    container_name: mcp-gateway-authentik-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./data/authentik/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - mcp-gateway-net
      - consola-mwt-one-net

  # -----------------------------------------------------------------
  # Authentik — Redis (cache/session)
  # -----------------------------------------------------------------
  authentik-redis:
    image: redis:alpine
    container_name: mcp-gateway-authentik-redis
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    volumes:
      - ./data/authentik/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s
    networks:
      - mcp-gateway-net
      - consola-mwt-one-net

  # -----------------------------------------------------------------
  # Authentik — Server (IdP)
  # -----------------------------------------------------------------
  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2025.6.3}
    container_name: mcp-gateway-authentik-server
    restart: unless-stopped
    command: server
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@mwt.one}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_ADMIN_PASSWORD}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - mcp-gateway-net
      - consola-mwt-one-net

  # -----------------------------------------------------------------
  # Authentik — Worker
  # -----------------------------------------------------------------
  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2025.6.3}
    container_name: mcp-gateway-authentik-worker
    restart: unless-stopped
    command: worker
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - mcp-gateway-net
      - consola-mwt-one-net

  # -----------------------------------------------------------------
  # ContextForge — MCP gateway, registry and proxy (OAuth -> Authentik)
  # -----------------------------------------------------------------
  contextforge:
    image: ghcr.io/ibm/mcp-context-forge:latest
    container_name: mcp-gateway-contextforge
    restart: unless-stopped
    entrypoint: ["/patch/entrypoint.sh"]
    depends_on:
      authentik-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "4444"
      APP_DOMAIN: https://mcp.mwt.one
      DATABASE_URL: sqlite:////data/mcp.db
      MCPGATEWAY_UI_ENABLED: "true"
      # Fugu · Ola 2 - 2.15 · hardening producción.
      MCPGATEWAY_ADMIN_API_ENABLED: "false"
      # Ola 2 · RBAC por rol MWT: el gateway MWT corre en direct_proxy para que
      # tools/list se reenvíe EN VIVO al server MCP con la identidad del usuario
      # (X-Forwarded-User-*), y el filtrado por rol de mwt_mcp/tool_rbac.py
      # oculte las tools que la matriz /roles no permite.
      MCPGATEWAY_DIRECT_PROXY_ENABLED: "true"
      SSO_ENABLED: "true"
      AUTH_REQUIRED: "true"
      SECURE_COOKIES: "true"
      LOG_LEVEL: INFO
      SSRF_ALLOWED_NETWORKS: '["172.21.0.0/16"]'
      # Ola 6 · reenvío de headers X-MWT-Client-ID/X-MWT-Gateway-Key al
      # upstream MCP (para el aislamiento por cliente). Sin esto, el direct_proxy
      # no reenvía los headers y el MCP rechaza la identidad.
      ENABLE_HEADER_PASSTHROUGH: "true"
    volumes:
      - ./data/contextforge:/data
      - ./patch:/patch
    networks:
      - mcp-gateway-net
      - consola-mwt-one-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4444/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

# ---------------------------------------------------------------------
# Volúmenes / datos persistentes
# ---------------------------------------------------------------------
# ./data/authentik/postgresql · ./data/authentik/redis · ./data/contextforge
# ./patch -> entrypoint wrapper + patches de ContextForge

# ---------------------------------------------------------------------
# Redes
# ---------------------------------------------------------------------
networks:
  mcp-gateway-net:
    name: mcp-gateway-net
    driver: bridge
  consola-mwt-one-net:
    name: consola-mwt-one-net
    external: true
