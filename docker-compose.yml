# =====================================================================
# Consola MWT.ONE · docker-compose.yml
# Agente responsable: [AG-BACKEND] + [AG-FRONTEND]
#
# Nombre del proyecto:  consola-mwt-one
# Contenedores:
#   · consola-mwt-one-postgres   (pgvector/pgvector:pg16)   5434:5432
#   · consola-mwt-one-redis      (redis:7-alpine)           6380:6379
#   · consola-mwt-one-django     (backend DRF + gunicorn)   8100:8000
#   · consola-mwt-one-frontend   (Vite build + nginx)       3100:80
#
# Puertos elegidos para NO chocar con el proyecto `mwt` que ya corre:
#   mwt usa 5433 (postgres), 6379 (redis), 8000 (django), 3000 (frontend).
#
# Uso:
#     docker compose up -d --build
#     docker compose logs -f consola-mwt-one-frontend
#     docker compose down
#
# Acceso:
#     Frontend (SPA):  http://localhost:3100
#     API Django:      http://localhost:8100/api/auth/login/
#     Postgres:        psql -h localhost -p 5434 -U mwt -d mwt_one
# =====================================================================

name: consola-mwt-one

# ---------------------------------------------------------------------
# Env compartido del backend (anchor YAML)
# ---------------------------------------------------------------------
x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-prod}
  DJANGO_DEBUG:      ${DJANGO_DEBUG:-0}
  # Hosts aceptados por Django (coma-separados).
  # Añade tu dominio (ej. consola.muitowork.com) cuando apuntes DNS al VPS.
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,187.77.218.102,consola.mwt.one}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://187.77.218.102:3100,http://187.77.218.102:8100,https://consola.mwt.one,http://consola.mwt.one}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://187.77.218.102:3100,http://187.77.218.102:8100,https://consola.mwt.one,http://consola.mwt.one}
  DB_NAME:     mwt_one
  DB_USER:     mwt
  DB_PASSWORD: ${DB_PASSWORD:-mwt}
  DB_HOST:     postgres
  DB_PORT:     "5432"
  REDIS_URL:   redis://redis:6379/0
  SQL_DIR:     /sql
  TZ:          America/Mexico_City
  # ── Builder externo (Sprint 2026-05-01) ─────────────────────
  # Login server-side al Builder; el access token se cachea en
  # memoria por 4 min. Si no se setea BUILDER_PASSWORD, los
  # endpoints /api/builder/templates/* devolverán 502.
  BUILDER_API_BASE: ${BUILDER_API_BASE:-https://builder.muito.work/api}
  BUILDER_USERNAME: ${BUILDER_USERNAME:-Admin}
  BUILDER_PASSWORD: ${BUILDER_PASSWORD:-}
  BUILDER_TOKEN_TTL_S: ${BUILDER_TOKEN_TTL_S:-240}
  # NOTA EMAIL_*: NO se declaran aquí porque sus valores contienen `$`
  # (ej. EMAIL_DOC_PASSWORD=…$Nd5n) y compose haría doble expansion.
  # Se inyectan vía `env_file: .env` en el servicio django.

services:

  # -----------------------------------------------------------------
  # PostgreSQL + pgvector
  # -----------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: consola-mwt-one-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       mwt_one
      POSTGRES_USER:     mwt
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mwt}
      TZ:                America/Mexico_City
    volumes:
      - consola-mwt-one-pgdata:/var/lib/postgresql/data
      # Se ejecutan automáticamente la primera vez (orden alfabético)
      - ./database/01_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/02_auth_admin.sql:/docker-entrypoint-initdb.d/02-auth-admin.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwt -d mwt_one"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - consola-net

  # -----------------------------------------------------------------
  # Redis (cache Django + broker futuro para Celery)
  # -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: consola-mwt-one-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - consola-mwt-one-redis-data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - consola-net

  # -----------------------------------------------------------------
  # Backend Django (API pura DRF + JWT)
  # -----------------------------------------------------------------
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: consola-mwt-one/django:latest
    container_name: consola-mwt-one-django
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    # env_file: pasa el .env al container SIN re-expansion (necesario
    # para vars que tienen `$` en su valor, ej. EMAIL_*_PASSWORD).
    # `environment` (anchor) tiene precedencia sobre env_file en compose.
    env_file:
      - .env
    environment: *backend-env
    volumes:
      - ./backend:/app
      - ./database:/sql:ro            # init.sql + 02_auth_admin.sql (bootstrap)
      - ./backend/sql:/sql-modules:ro # 10_nodos.sql … 99_seed.sql (módulos + seed demo)
    ports:
      - "8100:8000"
    networks:
      - consola-net
      - mwt_default   # red del stack `mwt` (MinIO, Paperless…). Sin ella,
                      # MINIO_ENDPOINT=http://mwt-minio:9000 no resuelve (502 en /api/storage/*).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/auth/login/", "-X", "OPTIONS"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # -----------------------------------------------------------------
  # Celery worker — Fase 3 (queue ai_analyzer + emails + default)
  # -----------------------------------------------------------------
  # Usa la misma imagen del servicio django (build context idéntico)
  # pero arranca como worker en lugar de gunicorn. Escucha 3 queues:
  #   · ai_analyzer  — llamadas a Claude para validar comprobantes
  #   · emails       — envíos SMTP/SES (Fase 4)
  #   · default      — todo lo demás (tickets, etc.)
  # Si el worker se cae, la API sigue funcionando: tasks.enqueue_*
  # tiene fallback síncrono (FINANCE_AI_SYNC=1 fuerza in-process).
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: consola-mwt-one/django:latest
    container_name: consola-mwt-one-celery-worker
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      django:   { condition: service_started }
    env_file:
      - .env
    environment: *backend-env
    volumes:
      - ./backend:/app
      - ./database:/sql:ro
      - ./backend/sql:/sql-modules:ro
    command: >
      celery -A config worker
        --loglevel=info
        --concurrency=2
        --queues=ai_analyzer,emails,default
        --hostname=worker@%h
    networks:
      - consola-net
      - mwt_default   # el worker descarga adjuntos de MinIO (emails, OCR)
    healthcheck:
      # `celery inspect ping` devuelve "pong" si el worker está vivo.
      test: ["CMD-SHELL", "celery -A config inspect ping -d worker@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -----------------------------------------------------------------
  # Celery beat — Fase 5A (cron · fx_rate_refresh @ 0 1 * * * UTC)
  # -----------------------------------------------------------------
  # Una sola instancia. Usa el PersistentScheduler default de Celery
  # (file-backed) en lugar de django_celery_beat.DatabaseScheduler
  # porque este proyecto tiene MIGRATION_MODULES desactivado y las
  # tablas django_celery_beat_* no existen.
  #
  # El schedule lo lee desde settings.CELERY_BEAT_SCHEDULE (Python),
  # y persiste el next-run en /var/celerybeat/schedule (volumen
  # nombrado para sobrevivir a redeploys).
  #
  # Bootstrap: el contenedor crea /var/celerybeat si el volumen está
  # vacío (chown root:root). Si en el futuro queremos migrar a
  # DatabaseScheduler hay que desbloquear MIGRATION_MODULES selectivamente.
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: consola-mwt-one/django:latest
    container_name: consola-mwt-one-celery-beat
    restart: unless-stopped
    depends_on:
      postgres:      { condition: service_healthy }
      redis:         { condition: service_healthy }
      celery-worker: { condition: service_started }
    env_file:
      - .env
    environment: *backend-env
    volumes:
      - ./backend:/app
      - ./database:/sql:ro
      - ./backend/sql:/sql-modules:ro
      - consola-mwt-one-celerybeat:/var/celerybeat
    command: >
      sh -c "mkdir -p /var/celerybeat &&
             celery -A config beat
               --loglevel=info
               --schedule=/var/celerybeat/schedule"
    networks:
      - consola-net

  # -----------------------------------------------------------------
  # MCP Server (para agentes externos: ContextForge, Claude, etc.)
  # -----------------------------------------------------------------
  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    image: consola-mwt-one/mcp-server:latest
    container_name: consola-mwt-one-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MWT_MCP_TRANSPORT: http
      MWT_MCP_HOST: 0.0.0.0
      MWT_MCP_PORT: "8765"
      MWT_API_BASE: https://consola.mwt.one/api
      # Si quieres firma local de JWT de usuario, añade MWT_JWT_SIGNING_SECRET
      # al .env (mismo valor que DJANGO_SECRET_KEY). Por defecto se usa el
      # endpoint /api/auth/mcp-token/ del backend, que es más seguro.
    networks:
      - consola-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 8765)); s.close()\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -----------------------------------------------------------------
  # Frontend (Vite build + nginx)
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
        # Mock mode: 1 = apaga el backend salvo /auth/*; 0 = backend real.
        # Override desde env del host:  VITE_USE_MOCKS=1 docker compose up -d --build frontend
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-0}
    image: consola-mwt-one/frontend:latest
    container_name: consola-mwt-one-frontend
    restart: unless-stopped
    depends_on:
      - django
    # Puerto host configurable por env (default 3101, antes 3100).
    # Cambiamos del 3100 al 3101 porque mwt-builder-nginx ya tomó el
    # 3100 en el VPS compartido. El routing público de consola.mwt.one
    # va por mwt-nginx (reverse proxy) — este puerto es sólo para
    # acceso directo de debug en localhost del VPS.
    ports:
      - "${CONSOLA_FRONTEND_PORT:-3101}:80"
    networks:
      - consola-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

# ---------------------------------------------------------------------
# Volúmenes nombrados (persistentes entre `docker compose down`)
# ---------------------------------------------------------------------
volumes:
  consola-mwt-one-pgdata:
    name: consola-mwt-one-pgdata
  consola-mwt-one-redis-data:
    name: consola-mwt-one-redis-data
  # Persistencia del archivo schedule de celery-beat (PersistentScheduler).
  # Sobrevive a `docker compose down` para no re-disparar el cron al
  # próximo `up` si ya se ejecutó hoy.
  consola-mwt-one-celerybeat:
    name: consola-mwt-one-celerybeat

# ---------------------------------------------------------------------
# Red interna (nombres DNS: postgres, redis, django, frontend)
# ---------------------------------------------------------------------
networks:
  consola-net:
    name: consola-mwt-one-net
    driver: bridge
  # Red externa del stack `mwt` (mwt-minio, mwt-paperless…). Debe existir
  # antes del `up` (en el VPS ya existe; en dev: docker network create mwt_default).
  mwt_default:
    external: true
