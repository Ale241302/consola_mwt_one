# =====================================================================
# Consola MWT.ONE · frontend/nginx.conf
# - SPA fallback: cualquier ruta no encontrada → /index.html (React Router)
# - /api/*  →  http://django:8000/api/*  (servicio del docker-compose)
# - Cache largo para assets con hash, no-cache para index.html
# =====================================================================

upstream consola_mwt_one_django {
    server django:8000;
    keepalive 32;
}

server {
    listen       80 default_server;
    server_name  _;

    # --- Compresión ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/xml+rss
        image/svg+xml font/woff2;

    # --- Hardening básico ---
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ------------------- Proxy a Django (API) -------------------------
    location /api/ {
        proxy_pass         http://consola_mwt_one_django;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 90s;
        client_max_body_size 25m;
    }

    # ------------------- Health del frontend --------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ------------------- SPA (React Router) ---------------------------
    root  /usr/share/nginx/html;
    index index.html;

    # Cache largo para assets versionados (hash en filename) emitidos por Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fuentes /fonts/*.woff2
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA: cualquier ruta desconocida → index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Errores
    error_page 500 502 503 504 /index.html;
}
