# =====================================================================
# Consola MWT.ONE · consola.conf
# Agente responsable: [AG-DEVOPS]
#
# Server block de nginx que expone https://consola.mwt.one apuntando
# al stack `consola-mwt-one` (frontend + backend Django).
#
# Este archivo se MONTA dentro del contenedor `mwt-nginx` del proyecto
# vecino `mwt_builder` (que es el que tiene los puertos 80/443 del VPS).
# Para que mwt-nginx pueda resolver los nombres `consola-mwt-one-*`,
# debe estar conectado a la red `consola-mwt-one-net`:
#
#     docker network connect consola-mwt-one-net mwt-nginx
#
# Ruta destino dentro del contenedor:
#     /etc/nginx/conf.d/consola.conf
#
# Despliegue en caliente (sin reiniciar mwt-nginx):
#     docker cp /opt/mwt/nginx/consola.conf mwt-nginx:/etc/nginx/conf.d/consola.conf
#     docker exec mwt-nginx nginx -t
#     docker exec mwt-nginx nginx -s reload
#
# TLS: reusa el cert self-signed ya presente en `/etc/nginx/ssl/` del
# mwt-nginx. Cloudflare en modo "Full (not strict)" lo acepta al
# hablar con el origen; el usuario final ve el cert válido de Cloudflare.
#
# Rate-limit zones (general_zone, auth_zone) están definidas en
# mwt.conf al top-level, así que están disponibles aquí también.
# =====================================================================

upstream consola_django {
    server consola-mwt-one-django:8000;
}

upstream consola_frontend {
    server consola-mwt-one-frontend:80;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name consola.mwt.one;

    # Cert self-signed heredado del mwt-nginx (Cloudflare: Full no-strict)
    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    client_max_body_size 10M;
    server_tokens off;
    large_client_header_buffers 8 64k;
    http2_max_field_size 64k;
    http2_max_header_size 64k;

    # Security headers (mismos que mwt.conf)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # -----------------------------------------------------------------
    # Auth endpoints: rate-limit más estricto
    # -----------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_pass http://consola_django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
    }

    # -----------------------------------------------------------------
    # API general
    # -----------------------------------------------------------------
    location /api/ {
        limit_req zone=general_zone burst=20 nodelay;
        limit_req_status 429;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_pass http://consola_django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
    }

    # -----------------------------------------------------------------
    # Frontend SPA (nginx interno del contenedor consola-mwt-one-frontend)
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://consola_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
