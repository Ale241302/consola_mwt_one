# =====================================================================
# Consola MWT.ONE · consola.conf
# Agente responsable: [AG-DEVOPS]
#
# Server block de nginx que expone https://consola.mwt.one apuntando
# al stack `consola-mwt-one` (frontend + backend Django).
#
# Este archivo se MONTA dentro del contenedor `mwt-nginx` del proyecto
# vecino `mwt_builder` (que es el que tiene los puertos 80/443 del VPS).
# Para que mwt-nginx pueda resolver los nombres `consola-mwt-one-*`,
# debe estar conectado a la red `consola-mwt-one-net`:
#
#     docker network connect consola-mwt-one-net mwt-nginx
#
# Ruta destino dentro del contenedor:
#     /etc/nginx/conf.d/consola.conf
#
# Despliegue en caliente (sin reiniciar mwt-nginx):
#     docker cp /opt/mwt/nginx/consola.conf mwt-nginx:/etc/nginx/conf.d/consola.conf
#     docker exec mwt-nginx nginx -t
#     docker exec mwt-nginx nginx -s reload
#
# TLS: reusa el cert self-signed ya presente en `/etc/nginx/ssl/` del
# mwt-nginx. Cloudflare en modo "Full (not strict)" lo acepta al
# hablar con el origen; el usuario final ve el cert válido de Cloudflare.
#
# Rate-limit zones (general_zone, auth_zone) están definidas en
# mwt.conf al top-level, así que están disponibles aquí también.
# =====================================================================

upstream consola_django {
    server consola-mwt-one-django:8000;
}

upstream consola_frontend {
    server consola-mwt-one-frontend:80;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name consola.mwt.one;

    # Cert self-signed heredado del mwt-nginx (Cloudflare: Full no-strict)
    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # 50M para soportar uploads del Motor de Precios (Excel COMEX ≈ 3-15 MB).
    client_max_body_size 50M;
    server_tokens off;
    large_client_header_buffers 8 64k;
    http2_max_field_size 64k;
    http2_max_header_size 64k;

    # Security headers (mismos que mwt.conf)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # -----------------------------------------------------------------
    # Mantenimiento: durante un redeploy el upstream (django/frontend) está
    # momentáneamente caído. En vez del 502 crudo, servimos una página que
    # auto-refresca (documento) o un 503 JSON limpio (API). Cuando el
    # backend vuelve (~40s), la página carga sola y el front reintenta.
    # -----------------------------------------------------------------
    location @consola_maint_html {
        default_type text/html;
        add_header Retry-After 8 always;
        return 503 '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="refresh" content="5"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizando — MWT.ONE</title><style>html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0B1E3A;color:#E8EDF3}.box{text-align:center;max-width:440px;padding:32px}.spin{width:40px;height:40px;border:3px solid rgba(255,255,255,.18);border-top-color:#13B98A;border-radius:50%;margin:0 auto 20px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:18px;margin:0 0 8px;font-weight:700}p{font-size:13px;color:#94A7B8;margin:0;line-height:1.5}</style></head><body><div class="box"><div class="spin"></div><h1>Estamos actualizando la consola</h1><p>Esto toma unos segundos. La página se recargara automaticamente.</p></div></body></html>';
    }
    location @consola_maint_api {
        default_type application/json;
        add_header Retry-After 8 always;
        return 503 '{"detail":"El servicio se esta actualizando, reintenta en unos segundos.","status":503,"retryable":true}';
    }

    # -----------------------------------------------------------------
    # Auth endpoints: rate-limit más estricto
    # -----------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_pass http://consola_django;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 = @consola_maint_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }

    # -----------------------------------------------------------------
    # API general
    # -----------------------------------------------------------------
    location /api/ {
        limit_req zone=general_zone burst=20 nodelay;
        limit_req_status 429;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_pass http://consola_django;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 = @consola_maint_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }

    # -----------------------------------------------------------------
    # Frontend SPA (nginx interno del contenedor consola-mwt-one-frontend)
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://consola_frontend;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        error_page 502 503 504 = @consola_maint_html;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# -----------------------------------------------------------------
# MCP Gateway — ContextForge (mcp.consola.mwt.one)
# -----------------------------------------------------------------
upstream contextforge {
    server mcp-gateway-contextforge:4444;
}

# Authentik IdP (para el flujo OAuth del MCP por cliente)
upstream authentik_server {
    server mcp-gateway-authentik-server:9000;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.mwt.one;

    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    client_max_body_size 50M;
    server_tokens off;

    # ── OAuth endpoints del MCP por cliente ─────────────────────────
    # Claude descubre el authorization_endpoint vía RFC 9728 y redirige
    # el navegador a /authorize (y luego POST a /token). Estos deben
    # proxificar a Authentik (idp.mwt.one) porque es el IdP real.
    # El client_id de cada cliente (mcp-provider-*) se pasa en el query.
    location = /authorize {
        proxy_pass http://authentik_server/application/o/authorize/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }

    location = /token {
        proxy_pass http://authentik_server/application/o/token/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }

    location = /userinfo {
        proxy_pass http://authentik_server/application/o/userinfo/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }

    # ── UI/flows de Authentik cuando el OAuth se proxifica por mcp.mwt.one ──
    # Tras el /authorize, Authentik redirige al navegador a /flows/...,
    # /if/... y /static/... en el MISMO host (mcp.mwt.one). Estos deben ir a
    # Authentik, no a ContextForge.
    location /flows/ {
        proxy_pass http://authentik_server/flows/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }
    location /if/ {
        proxy_pass http://authentik_server/if/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }
    location /static/ {
        proxy_pass http://authentik_server/static/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }
    location /application/o/ {
        proxy_pass http://authentik_server/application/o/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }

    # ── Ola 5 · MCP por cliente: inyecta el cliente del virtual server ──
    # Cada server virtual (un vsid por cliente) se identifica por su ruta
    # /servers/<vsid>/mcp. nginx inyecta X-MWT-Client-ID (UUID del cliente)
    # y X-MWT-Gateway-Key (secreto compartido) que ContextForge reenvía al
    # MCP server vía passthrough_headers de la gateway. El MCP (Ola 2) los
    # valida ANTES de honrar la identidad X-Forwarded-User-*.
    # Map: vsid -> (client_id, gateway_key). El gateway key viene del .env
    # del stack consola (MWT_MCP_GATEWAY_KEY) — aquí lo sustituimos por la
    # variable de entorno del contenedor mwt-nginx (ver mount_consola_nginx).
    location = /servers/c090bf4d-af94-4aff-b682-8e9d1ebdcd6d/mcp {
        proxy_set_header X-MWT-Client-ID  "c588c410-468a-4d54-b676-3bec174eb39d";
        proxy_set_header X-MWT-Gateway-Key "$MWT_MCP_GATEWAY_KEY";
        proxy_pass http://contextforge;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }

    # ── Ola 6 · MCP por cliente — locations de los clientes restantes ──
    # Map: vsid -> client_id. Cada location inyecta el tenant del cliente.
    # (Comtek)
    location = /servers/299b060e-d78f-4608-9314-f0f5bf2f12c2/mcp {
        proxy_set_header X-MWT-Client-ID  "88888888-0000-4000-8000-000000000010";
        proxy_set_header X-MWT-Gateway-Key "$MWT_MCP_GATEWAY_KEY";
        proxy_pass http://contextforge;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }
    # (Importaciones y Compras)
    location = /servers/c062e0bc-2d2b-4018-ad47-7ed364c5c9db/mcp {
        proxy_set_header X-MWT-Client-ID  "88888888-0000-4000-8000-000000000012";
        proxy_set_header X-MWT-Gateway-Key "$MWT_MCP_GATEWAY_KEY";
        proxy_pass http://contextforge;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }
    # (Procostumer)
    location = /servers/d8853fca-cfe6-4fc5-adce-1e0183124c6f/mcp {
        proxy_set_header X-MWT-Client-ID  "88888888-0000-4000-8000-000000000013";
        proxy_set_header X-MWT-Gateway-Key "$MWT_MCP_GATEWAY_KEY";
        proxy_pass http://contextforge;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }
    # (Sonepar)
    location = /servers/1078a317-f34e-428a-8170-050f65bc7154/mcp {
        proxy_set_header X-MWT-Client-ID  "88888888-0000-4000-8000-000000000011";
        proxy_set_header X-MWT-Gateway-Key "$MWT_MCP_GATEWAY_KEY";
        proxy_pass http://contextforge;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }
    # (Imporcomp)
    location = /servers/e658aae0-247d-4bf7-a22f-49b9577b733a/mcp {
        proxy_set_header X-MWT-Client-ID  "88888888-0000-4000-8000-000000000014";
        proxy_set_header X-MWT-Gateway-Key "$MWT_MCP_GATEWAY_KEY";
        proxy_pass http://contextforge;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }
    # (Muito Work Limitada)
    location = /servers/6e62ee55-876c-4570-b707-58eebcdc0e65/mcp {
        proxy_set_header X-MWT-Client-ID  "5525986c-3b09-4d13-bf8f-43ccaa2deae3";
        proxy_set_header X-MWT-Gateway-Key "$MWT_MCP_GATEWAY_KEY";
        proxy_pass http://contextforge;
