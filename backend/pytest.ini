; =====================================================================
; MWT.ONE · pytest.ini
; Agente responsable: [AG-06-QA]
;
; Configuración base de la Suite de Pruebas Automatizadas MWT.
;   · Apunta al settings real (config.settings) — no hay "test settings"
;     porque la DB la maneja [AG-DATABASE] vía init.sql, sin migrations.
;   · --no-migrations: pytest-django no intentará migrate (innecesario
;     porque MIGRATION_MODULES = _DisableMigrations() en config/settings.py).
;   · --reuse-db: la DB sobrevive entre corridas (no la borramos jamás —
;     el schema lo trae 99_seed.sql + init.sql).
;   · -ra y --tb=long: traceback completo y resumen al final.
;   · markers: cada módulo de la plataforma se marca para poder correr
;     subconjuntos (ej. `pytest -m expedientes`).
; =====================================================================
[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

addopts =
    -ra
    -v
    --strict-markers
    --tb=long
    --showlocals
    --color=yes
    --no-migrations
    --reuse-db

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    dashboard:        Módulo 1 · Dashboard
    expedientes:      Módulo 2 · Expedientes
    pipeline:         Módulo 3 · Pipeline
    portal:           Módulo 4 · Portal B2B
    financiero:       Módulo 5 · Financiero
    transferencias:   Módulo 6 · Transferencias
    nodos:            Módulo 7 · Nodos
    clientes:         Módulo 8 · Clientes
    marcas:           Módulo 9 · Marcas
    productos:        Módulo 10 · Productos
    proveedores:      Módulo 11 · Proveedores
    inventario:       Módulo 12 · Inventario
    plantillas:       Módulo 13 · Plantillas de Email
    notificaciones:   Módulo 14 · Historial de Notificaciones
    cobros:           Módulo 15 · Cobros
    tickets:          Módulo 16 · Tickets de soporte
    finance:          Módulo 17 · Finance (payments wizard)
    analytics:        Módulo 18 · Analytics / Observabilidad
    fusion:           Módulo 19 · Fusión visual de expedientes
    r3:               Regla R3 · POL_VISIBILIDAD (crítica)
    smoke:            Smoke tests (rápidos, ejecutados primero)
    crud:             Tests CRUD básicos (Listar/Detalle/Crear/Editar/Borrar)
    integration:      Tests de integración entre módulos (UUIDs cruzados)
    no_db:            Tests puros sin conexión a DB (ej. chart_svg, Ola 3.10)
